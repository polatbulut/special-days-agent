# TEMPLATE ONLY — do NOT put real keys here and do NOT commit a filled-in copy.
# Prefer creating the Secret imperatively (keeps the SK out of git entirely):
#
#   oc create secret generic special-days-obs-credentials \
#     --from-literal=OBS_ACCESS_KEY='<AK>' \
#     --from-literal=OBS_SECRET_KEY='<SK>'
#
# If you must use a file, copy this to secret.yaml (git-ignored), fill in the
# stringData values, and `oc apply -f`. stringData takes plain text (no base64).
apiVersion: v1
kind: Secret
metadata:
  name: special-days-obs-credentials
  labels:
    app: special-days-agent
type: Opaque
stringData:
  OBS_ACCESS_KEY: "REPLACE_WITH_AK"
  OBS_SECRET_KEY: "REPLACE_WITH_SK"
